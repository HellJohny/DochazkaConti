<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Docházková kalkulačka</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px auto;
      max-width: 1000px;
      padding: 20px;
      border-radius: 8px;
      background-color: #f4f4f4;
      color: #000;
      transition: background-color 0.3s, color 0.3s;
    }

    body.dark-mode {
      background-color: #121212;
      color: #f4f4f4;
    }

    h2 {
      margin-top: 30px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
    }

    label {
      display: block;
      margin: 15px 0 5px;
    }

    input[type="time"], input[readonly], input[type="text"] {
      width: 100%;
      padding: 6px;
      font-size: 16px;
      box-sizing: border-box;
      background-color: #ffffff;
      color: #000000;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    body.dark-mode input {
      background-color: #1f1f1f;
      color: #ffffff;
      border: 1px solid #555;
    }

    .readonly {
      background-color: #fffbe0;
      font-weight: bold;
    }

    body.dark-mode .readonly {
      background-color: #2a2a1f;
    }

    button {
      margin-top: 15px;
      padding: 10px;
      width: 100%;
      background-color: #ff8200;
      color: white;
      border: none;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.3s, box-shadow 0.2s;
    }

    button:hover {
      background-color: #e67300;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    button:active {
      transform: scale(0.98);
    }

    #vysledek, #vysledek2 {
      margin-top: 15px;
      font-weight: bold;
      font-size: 18px;
      text-align: center;
      white-space: pre-line;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    #toggleDarkMode {
      width: auto;
      padding: 6px 10px;
      font-size: 14px;
      background-color: #555;
      color: white;
    }

    .container {
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .calculator {
      width: 48%;
    }

    .history-container {
      margin-top: 20px;
    }

    .history {
      margin-top: 20px;
    }

    .history h3 {
      margin-bottom: 5px;
    }

    .history-list {
      background: #eeeeee;
      padding: 10px;
      border-radius: 5px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 14px;
    }

    body.dark-mode .history-list {
      background: #1e1e1e;
    }

    .history .clear-btn {
      width: 32px;
      height: 32px;
      font-size: 16px;
      background-color: #c00;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      margin-left: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .history-item {
      padding: 4px 0;
    }

    .history-item.highlight {
      background-color: #d6f5d6;
      font-weight: bold;
    }

    body.dark-mode .history-item.highlight {
      background-color: #264d26;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h2>Docházková kalkulačka 👋</h2>
    <button id="toggleDarkMode">🌙 Dark mode</button>
  </div>

  <div class="container">
    <div class="calculator">
      <h2>🕒 Výpočet času odchodu</h2>
      <label>Čas příchodu:
        <input type="time" id="prichod" required>
      </label>
      <label>Potřebná pracovní doba:
        <input type="time" id="pracovniDoba" value="08:30" readonly class="readonly">
      </label>
      <label>Saldo:
        <input type="text" id="saldo" value="+00:00" required>
      </label>
      <label>
        <input type="checkbox" id="zápornýČas"> ±
      </label>
      <button onclick="spocitej()">Spočítej čas odchodu</button>
      <div id="vysledek"></div>
      <div class="history">
        <h3>📜 Historie výpočtů (čas odchodu)</h3>
        <div class="history-list" id="historieOdchodu"></div>
        <button class="clear-btn" onclick="vymazHistorii('odchodu')">🗑️</button>
      </div>
    </div>

    <div class="calculator">
      <h2>📊 Výpočet odpracovaného času</h2>
      <label>Čas příchodu:
        <input type="time" id="prichod2" required>
      </label>
      <label>Čas odchodu:
        <input type="time" id="odchod2" required>
      </label>
      <button onclick="spocitejOdpracovano()">Spočítej odpracovaný čas</button>
      <div id="vysledek2"></div>
      <div class="history">
        <h3>📜 Historie výpočtů (odpracováno)</h3>
        <div class="history-list" id="historieOdpracovano"></div>
        <button class="clear-btn" onclick="vymazHistorii('odpracovano')">🗑️</button>
      </div>
    </div>
  </div>

  <script>
    function casNaMinuty(cas) {
      const [hod, min] = cas.split(':').map(Number);
      return hod * 60 + min;
    }

    function minutyNaCas(minuty) {
      const hod = Math.floor(Math.abs(minuty) / 60);
      const min = Math.abs(minuty) % 60;
      const sign = minuty < 0 ? "-" : "";
      return sign + String(hod).padStart(2, '0') + ':' + String(min).padStart(2, '0');
    }

    function spocitej() {
      const prichod = document.getElementById('prichod').value;
      const pracovniDoba = document.getElementById('pracovniDoba').value;
      const saldoRaw = document.getElementById('saldo').value;
      const zapornyCas = document.getElementById('zápornýČas').checked;

      if (!prichod || !pracovniDoba || !saldoRaw) {
        document.getElementById('vysledek').textContent = 'Vyplň prosím všechna pole.';
        return;
      }

      const saldo = saldoRaw.replace(/^\+|-/, '');
      let saldoMinuty = casNaMinuty(saldo);
      if (zapornyCas) {
        saldoMinuty = -saldoMinuty;
      }

      const casOdchoduMinuty = casNaMinuty(prichod) + casNaMinuty(pracovniDoba) - saldoMinuty;
      const vysledek = minutyNaCas(casOdchoduMinuty);
      const text = `✅ Můžeš odejít v: ${vysledek}`;
      const textSHistorií = `${text} (Vypočítáno: ${new Date().toLocaleString()})`;

      document.getElementById('vysledek').textContent = text;
      ulozDoHistorie('odchodu', textSHistorií);
    }

    function spocitejOdpracovano() {
      const prichod = document.getElementById('prichod2').value;
      const odchod = document.getElementById('odchod2').value;
      const cilovaDoba = 8 * 60 + 0;

      if (!prichod || !odchod) {
        document.getElementById('vysledek2').textContent = 'Zadej příchod a odchod.';
        return;
      }

      let odpracovano = casNaMinuty(odchod) - casNaMinuty(prichod) - 30;
      const rozdil = odpracovano - cilovaDoba;

      const base = `⏱ Odpracováno: ${minutyNaCas(odpracovano)}\n${
        rozdil === 0
          ? "✅ Máš přesně odpracováno."
          : rozdil > 0
          ? "👍 Nadpracováno: +" + minutyNaCas(rozdil)
          : "⚠️ Chybí: " + minutyNaCas(rozdil)
      }`;
      const textSHistorií = `${base} (Vypočítáno: ${new Date().toLocaleString()})`;

      document.getElementById('vysledek2').textContent = base;
      ulozDoHistorie('odpracovano', textSHistorií);
    }

    document.getElementById('zápornýČas').addEventListener('change', function () {
      const saldoInput = document.getElementById('saldo');
      let hodnotabez = saldoInput.value.replace(/^\+|-/, '');
      saldoInput.value = this.checked ? '-' + hodnotabez : '+' + hodnotabez;
    });

    document.getElementById('toggleDarkMode').addEventListener('click', function () {
      const body = document.body;
      body.classList.toggle('dark-mode');

      if (body.classList.contains('dark-mode')) {
        this.textContent = '🌞 Light mode';
        localStorage.setItem('theme', 'dark');
      } else {
        this.textContent = '🌙 Dark mode';
        localStorage.setItem('theme', 'light');
      }
    });

    window.onload = function () {
      const savedTheme = localStorage.getItem('theme') || 'light';
      const body = document.body;

      if (savedTheme === 'dark') {
        body.classList.add('dark-mode');
        document.getElementById('toggleDarkMode').textContent = '🌞 Light mode';
      } else {
        body.classList.remove('dark-mode');
        document.getElementById('toggleDarkMode').textContent = '🌙 Dark mode';
      }

      zobrazHistorii('odchodu');
      zobrazHistorii('odpracovano');
    };

    function ulozDoHistorie(typ, text) {
      const key = typ === 'odchodu' ? 'historieOdchodu' : 'historieOdpracovano';
      let historie = JSON.parse(localStorage.getItem(key)) || [];
      historie.unshift(text);
      if (historie.length > 50) historie.pop();
      localStorage.setItem(key, JSON.stringify(historie));
      zobrazHistorii(typ);
    }

    function zobrazHistorii(typ) {
      const key = typ === 'odchodu' ? 'historieOdchodu' : 'historieOdpracovano';
      const el = document.getElementById(key);
      const historie = JSON.parse(localStorage.getItem(key)) || [];
      el.innerHTML = historie
        .map((e, i) => `<div class="history-item${i === 0 ? ' highlight' : ''}">${e}</div>`)
        .join('');
    }

    function vymazHistorii(typ) {
      const key = typ === 'odchodu' ? 'historieOdchodu' : 'historieOdpracovano';
      localStorage.removeItem(key);
      zobrazHistorii(typ);
    }

    // Přidání posluchače pro Enter klávesu pro výpočet času odchodu
    document.getElementById('prichod').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        spocitej();
      }
    });

    document.getElementById('pracovniDoba').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        spocitej();
      }
    });

    document.getElementById('saldo').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        spocitej();
      }
    });

    // Přidání posluchače pro Enter klávesu pro výpočet odpracovaného času
    document.getElementById('prichod2').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        spocitejOdpracovano();
      }
    });

    document.getElementById('odchod2').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        spocitejOdpracovano();
      }
    });

    // Pokud je saldo prázdné, nastaví se na "+00:00"
    document.getElementById('saldo').addEventListener('input', function () {
      if (this.value === '') {
        this.value = '+00:00'; // Pokud je pole prázdné, nastaví se výchozí hodnota
      }
    });
  </script>
</body>
</html>
